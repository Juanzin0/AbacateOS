    </g>
    <g fill="#4ade80" fill-opacity="0.18">
      <ellipse rx="110" ry="300" transform="rotate(15)"/>
      <ellipse rx="110" ry="300" transform="rotate(45)"/>
      <ellipse rx="110" ry="300" transform="rotate(75)"/>
      <ellipse rx="110" ry="300" transform="rotate(105)"/>
      <ellipse rx="110" ry="300" transform="rotate(135)"/>
      <ellipse rx="110" ry="300" transform="rotate(165)"/>
    </g>
    <circle r="70" fill="#d9f99d" fill-opacity="0.85"/>
