<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a1a"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bef264" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bef264" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="540" r="520" fill="url(#glow)"/>
  <g transform="translate(960 540)">
    <g fill="#a3e635" fill-opacity="0.22">
      <ellipse rx="150" ry="400" transform="rotate(0)"/>
      <ellipse rx="150" ry="400" transform="rotate(30)"/>
