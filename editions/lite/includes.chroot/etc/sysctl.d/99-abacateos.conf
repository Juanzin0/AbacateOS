# AbacateOS - ajustes de memoria e I/O para PCs com pouca RAM
# Com zram ativo, swappiness alto e bom: comprimir na RAM e mais rapido que ir ao disco.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.page-cluster = 0
kernel.nmi_watchdog = 0
net.core.default_qdisc = fq_codel
